spring.application.name=haft

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.changelog/master.xml

app.refresh-token-validity=${REFRESH_TOKEN_VAL}
jwt.expiration-time=${JWT_EXPIRATION_TIME}

jwt.issuer=${APP_ISSUER}
jwt.audience=${APP_AUDIENCE}
jwt.secret=${JWT_SECRET}

s3.accessKey=${S3_ACCESS_KEY}
s3.secretKey=${S3_SECRET_KEY}
s3.publicBucket.public=${S3_PUBLIC_BUCKET}
s3.privateBucket.private=${S3_PRIVATE_BUCKET}
s3.api.endpoint=${S3_API_ENDPOINT}
s3.region=${S3_REGION}
s3.public.endpoint=${S3_PUBLIC_ENDPOINT}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=INFO