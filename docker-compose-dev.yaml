name: neene-storage

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: local-haft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local-haft"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: your-access-key
      AWS_SECRET_ACCESS_KEY: your-secret-key
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:23646:23646"
    volumes:
      - seaweed-data:/data

  seaweedfs-init:
    image: amazon/aws-cli
    restart: "no"
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: your-access-key
      AWS_SECRET_ACCESS_KEY: your-secret-key
      AWS_DEFAULT_REGION: eu-central-1
      PUBLIC_BUCKET: public.bucket
      PRIVATE_BUCKET: private.bucket
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./infrastructure/seaweedfs:/init:ro
    entrypoint: [ "/bin/sh", "/init/init.sh" ]

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/local-haft
      S3_API_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:8333

volumes:
  postgres_data:
  seaweed-data:
