# To create database run following command:
# docker run --name local-haft-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=local-haft -p 5432:5432 -d postgres:16
# eventually run:
# docker exec -it local-haft-db psql -U postgres -d local-haft -c "CREATE SCHEMA haft_schema;"

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/local-haft?currentSchema=haft_schema
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG

# example jwt data. DO NOT USE THE SAME IN PRODUCTION
jwt.issuer=haft-issuer
jwt.audience=localhost
jwt.secret=ac55ee817fa8391e8a7a711e5f345319

s3.accessKey=your-access-key
s3.secretKey=your-secret-key
s3.galleryBucket.public=public.bucket
s3.galleryBucket.private=private.bucket
s3.api.endpoint=http://localhost:8333
s3.region=eu-central-1