# To create database run following command:
# docker run --name local-haft-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=local-haft -p 5432:5432 -d postgres:16
# eventually run:
# docker exec -it local-haft-db psql -U postgres -d local-haft -c "CREATE SCHEMA haft-schema;"

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/local-haft?currentSchema=haft-schema
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG