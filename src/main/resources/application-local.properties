# To host local application use following command:
# docker compose -f docker-compose-dev.yaml up -d
# if you want to use your Spring Boot Application turn "app" off manually or this command:
# docker compose -f docker-compose-dev.yaml stop app

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/local-haft
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG

# THIS IS EXAMPLE DATA, DO NOT USE THE SAME IN PRODUCTION
app.refresh-token-validity=30d
jwt.expiration-time=15m

jwt.issuer=haft-issuer
jwt.audience=localhost
jwt.secret=ac55ee817fa8391e8a7a711e5f345319

s3.accessKey=your-access-key
s3.secretKey=your-secret-key
s3.publicBucket.public=public.bucket
s3.privateBucket.private=private.bucket
s3.api.endpoint=http://127.0.0.1:8333
s3.public.endpoint=http://127.0.0.1:8333
s3.region=eu-central-1

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true